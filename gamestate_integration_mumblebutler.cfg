//
// Mumble-Butler CS2 Game State Integration config
//
// INSTRUCTIONS:
//   1. Replace 192.168.X.X with the LAN IP of the machine running Mumble-Butler.
//   2. Copy this file to:
//        C:\...\Counter-Strike Global Offensive\game\csgo\cfg\
//   3. The filename MUST start with "gamestate_integration_"
//   4. Launch CS2 — data will be POSTed to the bot automatically.
//
// NOTE: allplayers_* fields are fully populated only when spectating or on GOTV.
//       In a live match you get your own player_state only (anti-cheat restriction).
//

"MumbleButler"
{
    "uri"       "http://192.168.X.X:9100/"
    "timeout"   "5.0"
    "buffer"    "0.1"
    "throttle"  "0.1"
    "heartbeat" "30.0"
    "auth"      "mumblebutler_secret"
    "data"
    {
        "provider"               "1"
        "map"                    "1"
        "round"                  "1"
        "player_id"              "1"
        "player_state"           "1"
        "player_weapons"         "1"
        "player_match_stats"     "1"
        "allplayers_id"          "1"
        "allplayers_state"       "1"
        "allplayers_match_stats" "1"
        "allplayers_weapons"     "1"
        "allplayers_position"    "1"
        "phase_countdowns"       "1"
        "allgrenades"            "1"
    }
}
